name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 允许创建 release 和上传文件

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            build_cmd: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_ext: apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        if: matrix.target == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Keystore
        if: matrix.target == 'Android'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/echotv.jks

      - name: Build Application
        run: ${{ matrix.build_cmd }}
        env:
          KEYSTORE_PATH: /tmp/echotv.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Set artifact name
        id: artifact
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARTIFACT_NAME="echotv-${TAG_NAME}-${{ matrix.target }}"
          echo "name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "full_name=${ARTIFACT_NAME}.${{ matrix.artifact_ext }}" >> $GITHUB_OUTPUT

      - name: Prepare Artifacts (Android)
        if: matrix.target == 'Android'
        run: |
          cp ${{ matrix.artifact_path }} ${{ steps.artifact.outputs.full_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          fail_on_unmatched_files: true
